name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Setup Pages
        uses: actions/configure-pages@v2

      - name: Build
        run: |
          mkdir -p deploy
          cp -r OurLibrary/BowersWorld.com/* deploy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
